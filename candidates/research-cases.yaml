      deployment_requirements: {zh-tw: [Python 3、Playwright 與 Chromium, 可執行每週排程的 runner, 靜態 hosting 或 GitHub Pages, 需先核對法院與地理編碼服務的使用條款], en: [Python 3, Playwright and Chromium, a runner for weekly scheduling, static hosting or GitHub Pages, and review of court and geocoding service terms]}
