schema_version: "0.1.0"
title:
  zh-tw: 研究中候選案例
  en: Research-stage candidate cases
checked_on: "2026-08-28"
projects:
  - id: cloud-mail
    name: Cloud Mail
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: maillab/cloud-mail, license: MIT, default_branch: main, last_push: "2026-08-26", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 建立在 Cloudflare 上的簡易網域郵件服務, en: A simple domain email service built on Cloudflare}
      problem: {zh-tw: 解決自有網域收發郵件與附件需要維護完整郵件伺服器的問題, en: Solves the need to run a full mail server just to send and receive mail for a domain}
      audience: {zh-tw: [需要自有網域郵件的小型團隊, 需要自行掌握郵件資料的人], en: [Small teams needing domain email, people who want control of mail data]}
      capabilities: {zh-tw: [收發郵件與附件, 綁定單一網域, 以 Worker 部署郵件服務], en: [Send and receive mail with attachments, bind one domain, deploy the mail service on Workers]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, 自有網域與 Email Routing, 需依上游文件設定郵件路由], en: [Cloudflare Workers, a domain and Email Routing, upstream mail-routing configuration]}
      limitations: {zh-tw: [郵件路由與遞送可靠性仍需實際驗證, 單一網域限制需確認], en: [Mail routing and delivery reliability still need live verification, the one-domain limit needs confirmation]}
    architecture: {cloudflare: [workers, email-routing]}
    current_stage: {zh-tw: 已完成 README 與 metadata 研究, 尚未完成部署契約與實機驗證, en: README and metadata research is complete; the deployment contract and live verification are pending}
    next_steps: {zh-tw: [確認郵件路由與附件資料流, 建立可重現部署步驟, 完成收發與 teardown 驗收], en: [Confirm mail-routing and attachment data flows, write reproducible deployment steps, verify send receive and teardown]}

  - id: cloudflare-temp-email
    name: Cloudflare Temporary Email
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: dreamhunter2333/cloudflare_temp_email, license: MIT, default_branch: main, last_push: "2026-08-25", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 建立在 Cloudflare 上的臨時信箱服務, en: A temporary email service built on Cloudflare}
      problem: {zh-tw: 解決短期註冊或測試需要一次性收件地址，又不想使用第三方臨時信箱的問題, en: Solves the need for disposable addresses during signups or tests without relying on a third-party inbox}
      audience: {zh-tw: [軟體測試者, 需要短期收件地址的人], en: [Software testers, people needing short-lived inboxes]}
      capabilities: {zh-tw: [建立臨時信箱, 收發郵件與附件, IMAP／SMTP 與 Telegram Bot 整合], en: [Create temporary inboxes, handle mail and attachments, integrate IMAP SMTP and a Telegram bot]}
      deployment_requirements: {zh-tw: [Cloudflare Worker, 網域與郵件設定, 需核對外部郵件與 Telegram 設定], en: [A Cloudflare Worker, a domain and mail configuration, external mail and Telegram settings]}
      limitations: {zh-tw: [臨時信箱的保存期限與濫用防護需實測, 外部郵件遞送不由 Worker 單獨保證], en: [Retention and abuse controls need testing, external mail delivery is not guaranteed by the Worker alone]}
    architecture: {cloudflare: [workers, email-routing], external_services: [IMAP, SMTP, Telegram Bot]}
    current_stage: {zh-tw: 上游功能與部署線索已整理, 尚未建立 SmallGreen 研究以外的驗證證據, en: Upstream features and deployment clues are mapped; SmallGreen verification evidence is not started}
    next_steps: {zh-tw: [核對郵件供應商與資料保存位置, 驗證建立收件與過期流程, 設計濫用與 teardown 測試], en: [Confirm mail providers and data retention, verify inbox creation and expiry, design abuse and teardown tests]}

  - id: chatgpt-telegram-workers
    name: ChatGPT Telegram Workers
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: tbxark/ChatGPT-Telegram-Workers, license: MIT, default_branch: master, last_push: "2026-04-06", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 以 Cloudflare Worker 執行的自有 Telegram AI Bot, en: A self-hosted Telegram AI bot running on a Cloudflare Worker}
      problem: {zh-tw: 解決把 Telegram 對話接到指定 AI 服務時需要自行維護後端的問題, en: Solves the backend burden of connecting Telegram conversations to a chosen AI service}
      audience: {zh-tw: [想擁有自己 Telegram Bot 的人, 需要多模型切換的開發者], en: [People wanting their own Telegram bot, developers needing model switching]}
      capabilities: {zh-tw: [多 AI provider, 模型切換與串流, 自訂指令與多 Bot], en: [Multiple AI providers, model switching and streaming, custom commands and multiple bots]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, Telegram Bot Token, AI provider 憑證], en: [Cloudflare Workers, a Telegram Bot Token and AI provider credentials]}
      limitations: {zh-tw: [外部 AI provider 會產生成本與資料流風險, Bot 權限與公開 webhook 需額外防護], en: [External AI providers add cost and data-flow risk, bot permissions and public webhooks need hardening]}
    architecture: {cloudflare: [workers], external_services: [Telegram, AI providers]}
    current_stage: {zh-tw: 單檔 Worker 與功能範圍已確認, 尚未驗證各 provider 的部署差異, en: The single-file Worker and feature scope are confirmed; provider-specific deployment differences are unverified}
    next_steps: {zh-tw: [固定 provider 與 secret 邊界, 驗證 webhook 與模型切換, 補成本與資料刪除驗收], en: [Fix provider and secret boundaries, verify webhooks and model switching, add cost and data-deletion acceptance]}

  - id: agentic-inbox
    name: Agentic Inbox
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: cloudflare/agentic-inbox, license: Apache-2.0, default_branch: main, last_push: "2026-04-23", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 結合 Email Routing、Durable Object 與 AI Agent 的自架信箱, en: A self-hosted inbox combining Email Routing Durable Objects and an AI agent}
      problem: {zh-tw: 解決郵件閱讀、搜尋與回覆草稿散落在 SaaS，無法掌握信箱資料與自動化邊界的問題, en: Solves the loss of data control and automation boundaries when inbox work is scattered across SaaS tools}
      audience: {zh-tw: [需要自有信箱工作流的人, 想測試郵件 AI Agent 的開發者], en: [People needing an owned inbox workflow, developers testing email AI agents]}
      capabilities: {zh-tw: [每個信箱獨立儲存, 郵件搜尋與附件保存, Agent 讀取搜尋與草擬回覆], en: [Per-mailbox storage, email search and attachment retention, agent read search and reply drafting]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, Email Routing, Durable Objects SQLite, R2, Workers AI 或 Agents SDK], en: [Cloudflare Workers, Email Routing, Durable Objects SQLite, R2, Workers AI or the Agents SDK]}
      limitations: {zh-tw: [部署按鈕後仍需多項設定, AI 回覆與郵件資料邊界必須人工審查], en: [More configuration is needed after the deploy button, AI reply and email-data boundaries need human review]}
    architecture: {cloudflare: [workers, durable-objects, r2, workers-ai, email-routing], external_services: [Email Routing]}
    current_stage: {zh-tw: 上游架構與資料流清楚, 尚未完成小型部署與 AI 權限驗證, en: Upstream architecture and data flow are clear; a small deployment and AI-permission review are pending}
    next_steps: {zh-tw: [驗證 Durable Object mailbox 隔離, 確認附件與 AI 資料流, 完成部署後的設定與 teardown], en: [Verify Durable Object mailbox isolation, confirm attachment and AI data flows, complete post-deploy setup and teardown]}

  - id: moemail
    name: MoeMail
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: beilunyang/moemail, license: MIT, default_branch: master, last_push: "2026-07-30", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 以 Next.js 與 Cloudflare 組成的臨時信箱服務, en: A temporary email service built with Next.js and Cloudflare}
      problem: {zh-tw: 解決開發測試需要快速建立短期信箱的問題, en: Solves the need to quickly create short-lived inboxes for development and testing}
      audience: {zh-tw: [開發者, 測試者, 需要臨時收件的人], en: [Developers, testers, people needing temporary inboxes]}
      capabilities: {zh-tw: [建立與查看臨時信箱, 提供 API, 以 Cloudflare 部署前後端], en: [Create and inspect temporary inboxes, expose an API, deploy frontend and backend on Cloudflare]}
      deployment_requirements: {zh-tw: [Cloudflare Pages 或 Workers, Next.js 建置流程, 依文件設定環境變數], en: [Cloudflare Pages or Workers, a Next.js build flow and documented environment variables]}
      limitations: {zh-tw: [郵件保存與遞送規則需核對, Next.js 部署方式可能隨平台設定變動], en: [Mail retention and delivery rules need confirmation, the Next.js deployment path may vary with platform settings]}
    architecture: {cloudflare: [workers, pages], external_services: [Email provider]}
    current_stage: {zh-tw: 產品與部署文件已完成初步研究, 尚未驗證 Cloudflare 版本的完整郵件流程, en: Product and deployment docs are mapped; the complete Cloudflare mail flow is unverified}
    next_steps: {zh-tw: [確認 Cloudflare adapter 與 bindings, 實測信箱生命週期, 記錄外部郵件依賴], en: [Confirm the Cloudflare adapter and bindings, test inbox lifecycle, record external mail dependencies]}

  - id: cf-workers-status-page
    name: Cloudflare Worker Status Page
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: eidam/cf-workers-status-page, license: MIT, default_branch: main, last_push: "2024-08-21", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 以 Worker 與 Cron 監測網站的狀態頁, en: A status page that monitors websites with Workers and Cron}
      problem: {zh-tw: 解決小型服務需要公開可讀的可用性歷史與通知頁面的問題, en: Solves the need for a readable public availability history and notification page for small services}
      audience: {zh-tw: [維護個人服務的人, 需要公開狀態頁的小型團隊], en: [People maintaining personal services, small teams needing a public status page]}
      capabilities: {zh-tw: [定期檢查網站, 保存歷史狀態, 發送 Slack 或 Discord 通知], en: [Check websites on a schedule, keep status history, send Slack or Discord notifications]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, Cron, KV, 自有網域；通知服務為選配], en: [Cloudflare Workers, Cron, KV and a domain; notification services are optional]}
      limitations: {zh-tw: [上游長期未更新, 監測結果與通知延遲需實測], en: [The upstream has been inactive for a long time, monitoring results and notification latency need testing]}
    architecture: {cloudflare: [workers, kv, cron], external_services: [Slack or Discord webhooks]}
    current_stage: {zh-tw: 架構與維護風險已確認, 尚未決定是否值得進入部署驗證, en: Architecture and maintenance risk are known; its value for deployment verification is not decided}
    next_steps: {zh-tw: [確認目前 Cloudflare API 相容性, 實測 Cron 與 KV 歷史資料, 依維護風險決定去留], en: [Check current Cloudflare API compatibility, test Cron and KV history, decide whether maintenance risk is acceptable]}

  - id: vmail
    name: VMAIL
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: oiov/vmail, license: GPL-3.0, default_branch: main, last_push: "2026-07-16", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 以 Email Worker、D1 與 React 組成的臨時郵件服務, en: A temporary email service built from an Email Worker D1 and React frontend}
      problem: {zh-tw: 解決需要多網域臨時收件、API 與簡易管理介面的問題, en: Solves the need for multi-domain temporary mailboxes with an API and simple management interface}
      audience: {zh-tw: [測試者, 需要多網域郵件入口的開發者], en: [Testers, developers needing multi-domain mail entry points]}
      capabilities: {zh-tw: [多網域信箱, D1 保存郵件, REST API 與可選寄信 provider], en: [Multiple domains, D1 mail storage, a REST API and optional sending providers]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, D1, Email Routing, 自有網域與 Resend 或其他寄信服務], en: [Cloudflare Workers, D1, Email Routing, a domain and Resend or another sending service]}
      limitations: {zh-tw: [郵件內容含敏感資料時需明確保存政策, GPL-3.0 與外部寄信服務需納入發布審查], en: [Sensitive mail needs an explicit retention policy, GPL-3.0 and external sending services need release review]}
    architecture: {cloudflare: [workers, d1, email-routing], external_services: [Resend, MailChannels]}
    current_stage: {zh-tw: 功能與元件已整理, 尚未完成多網域與郵件遞送驗收, en: Features and components are mapped; multi-domain and delivery acceptance are pending}
    next_steps: {zh-tw: [核對 Email Routing 與 D1 schema, 實測多網域收件, 建立資料刪除與濫用測試], en: [Confirm Email Routing and D1 schema, test multi-domain receipt, add deletion and abuse tests]}

  - id: serverless-cloud-notepad
    name: Serverless Cloud Notepad
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: s0urcelab/serverless-cloud-notepad, license: MIT, default_branch: master, last_push: "2025-06-06", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 以 Worker 與 KV 提供免登入文字記事與分享的小型服務, en: A small no-login text note and sharing service using Workers and KV}
      problem: {zh-tw: 解決臨時文字需要快速記錄、同步與唯讀分享的問題, en: Solves the need to quickly record sync and share temporary text as read-only content}
      audience: {zh-tw: [需要簡易文字暫存的人, 開發與支援團隊], en: [People needing simple text scratch space, development and support teams]}
      capabilities: {zh-tw: [自訂路徑, 自動保存, 唯讀分享, 不需帳號或資料庫], en: [Custom paths, autosave, read-only sharing, no account or database]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, KV, GitHub Actions；需評估 KV 寫入額度], en: [Cloudflare Workers, KV and GitHub Actions; KV write limits need evaluation]}
      limitations: {zh-tw: [KV 每日寫入限制可能影響高頻保存, 長期維護狀態需再確認], en: [KV daily write limits may affect high-frequency saving, long-term maintenance needs rechecking]}
    architecture: {cloudflare: [workers, kv], github: [actions, repository]}
    current_stage: {zh-tw: 服務定位與資料層清楚, 尚未實測高頻自動保存與權限邊界, en: Product and data-layer roles are clear; high-frequency autosave and access boundaries are untested}
    next_steps: {zh-tw: [確認 KV 寫入模型, 驗證唯讀連結與路徑權限, 補 GitHub Actions teardown 流程], en: [Confirm the KV write model, verify read-only links and path access, add the GitHub Actions teardown flow]}

  - id: zmail
    name: ZMail
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: takumi913/zmail, license: MIT, default_branch: main, last_push: "2026-08-01", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 整合前後端的 24 小時臨時信箱 Worker, en: An integrated frontend and backend Worker for 24-hour temporary mailboxes}
      problem: {zh-tw: 解決短期測試需要有期限收件地址的問題, en: Solves the need for expiring inboxes during short-term testing}
      audience: {zh-tw: [開發者, 測試者, 需要短期收件的人], en: [Developers, testers, people needing short-lived inboxes]}
      capabilities: {zh-tw: [建立 24 小時信箱, 單一 Worker 前後端, 自訂網域與郵件路由], en: [Create 24-hour inboxes, run frontend and backend in one Worker, use a custom domain and mail routing]}
      deployment_requirements: {zh-tw: [Cloudflare Worker, 自有網域與 Email Routing, 需以 GitHub Action 或部署按鈕設定], en: [A Cloudflare Worker, a domain and Email Routing, GitHub Action or deploy-button setup]}
      limitations: {zh-tw: [目前 demo 標示只能查看且不能收信, 郵件過期與遞送尚待驗證], en: [The current demo says it is view-only and cannot receive mail, expiry and delivery are unverified]}
    architecture: {cloudflare: [workers, email-routing], github: [actions]}
    current_stage: {zh-tw: 身份、授權與基本產品形狀已確認, 尚未視為可部署服務, en: Identity license and basic product shape are confirmed; it is not considered deployable yet}
    next_steps: {zh-tw: [先修正或確認 demo 的收信狀態, 驗證 24 小時生命週期, 補郵件資料清除證據], en: [Resolve or confirm the demo receive-mail status, verify the 24-hour lifecycle, add mail-deletion evidence]}

  - id: roim-picx
    name: roim-picx
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: roimdev/roim-picx, license: Apache-2.0, default_branch: main, last_push: "2026-03-16", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 使用 R2、D1 與 KV 的自有圖片託管服務, en: An owned image-hosting service using R2 D1 and KV}
      problem: {zh-tw: 解決圖片放在第三方圖床，無法控制檔案、連結與統計資料的問題, en: Solves the loss of control over image files links and statistics on third-party hosts}
      audience: {zh-tw: [網站作者, 需要自有圖床的開發者, 管理圖片資產的人], en: [Website authors, developers needing an owned image host, people managing image assets]}
      capabilities: {zh-tw: [圖片上傳與資料夾, 分享與到期, OAuth, 統計與多儲存 provider], en: [Image upload and folders, sharing and expiry, OAuth, statistics and multiple storage providers]}
      deployment_requirements: {zh-tw: [Workers 或 Pages Functions, R2, D1, KV, OAuth provider], en: [Workers or Pages Functions, R2, D1, KV and an OAuth provider]}
      limitations: {zh-tw: [需要同時管理多個 binding 與 OAuth 權限, 圖片公開連結與刪除政策需審查], en: [Several bindings and OAuth permissions must be managed, public links and deletion policy need review]}
    architecture: {cloudflare: [workers, pages, r2, d1, kv], external_services: [OAuth provider]}
    current_stage: {zh-tw: 產品能力與 Cloudflare 元件已整理, 尚未驗證檔案權限與刪除流程, en: Product capabilities and Cloudflare components are mapped; file permissions and deletion are unverified}
    next_steps: {zh-tw: [確認 OAuth callback 與權限模型, 實測 R2 檔案生命週期, 建立公開連結撤銷驗收], en: [Confirm the OAuth callback and permission model, test the R2 file lifecycle, verify public-link revocation]}

  - id: authinbox
    name: AuthInbox
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: TooonyChen/AuthInbox, license: MIT, default_branch: main, last_push: "2026-07-09", checked_on: "2026-08-27"}
    product_summary:
      project_type: {zh-tw: 自架多信箱 OTP 收件與擷取平台, en: A self-hosted multi-inbox OTP receiving and extraction platform}
      problem: {zh-tw: 解決測試帳號驗證碼分散在信箱，難以分類、擷取與通知的問題, en: Solves the problem of OTPs being scattered across inboxes and difficult to classify extract and notify}
      audience: {zh-tw: [需要管理測試信箱的人, 自動化測試與帳號管理者], en: [People managing test inboxes, automation testers and account operators]}
      capabilities: {zh-tw: [多信箱管理, AI 分類與擷取, D1 儲存, Bark 通知與 Remote MCP], en: [Multi-inbox management, AI classification and extraction, D1 storage, Bark notifications and Remote MCP]}
      deployment_requirements: {zh-tw: [Cloudflare Workers, D1, Email Worker, AI provider, Bark 或其他通知服務], en: [Cloudflare Workers, D1, an Email Worker, an AI provider and Bark or another notification service]}
      limitations: {zh-tw: [OTP 與郵件是高敏感資料, AI provider、多人權限與 MCP 必須逐項審查], en: [OTPs and email are highly sensitive, AI providers multi-user permissions and MCP need review]}
    architecture: {cloudflare: [workers, d1, email-routing], external_services: [AI provider, Bark]}
    current_stage: {zh-tw: 功能面與外部依賴已整理, 尚未完成敏感資料與權限驗證, en: Features and external dependencies are mapped; sensitive-data and permission verification are pending}
    next_steps: {zh-tw: [畫出 OTP 資料流與保存邊界, 測試多人 grant 與撤銷, 驗證 AI 不必要資料暴露], en: [Map OTP data flow and retention boundaries, test multi-user grants and revocation, verify minimal AI data exposure]}

  - id: webviso
    name: Webviso
    axis: cloudflare-native
    state: content-research
    state_label: {zh-tw: 研究中, en: In research}
    source: {repository: yestool/analytics_with_cloudflare, license: MIT, default_branch: main, last_push: "2024-10-23", checked_on: "2026-08-27"}
    product_summary:
