# 機械生成（tools/gen_cards.py）——editorial 欄位改 EDITORIAL 字典後重生，勿直接手改推導欄位
id: newsnow
name: NewsNow
one_liner: 40+ 來源新聞熱榜聚合站，快取存自己的 D1
product_summary:
  project_type:
    zh-tw: 自架新聞來源聚合與排行網站
    en: A self-hosted news-source aggregator and ranking site
  problem:
    zh-tw: 團隊需要持續掌握多個來源，卻沒有簡單且可自有部署的閱讀入口
    en: A team needs to follow many sources but lacks a simple reading entry point
      it can deploy and control
  audience:
    zh-tw:
    - 需要產業情報的小型企業
    - 研究、內容與社群團隊
    en:
    - Small businesses tracking industry news
    - Research, content and community teams
  capabilities:
    zh-tw:
    - 聚合多個新聞來源
    - 把可重建的來源快取存入自己的 D1
    - 依來源與排行提供閱讀入口
    en:
    - Aggregate multiple news sources
    - Cache rebuildable source data in your own D1
    - Provide a source and ranking view for reading
  deployment_requirements:
    zh-tw:
    - 需要 Cloudflare Pages 與 D1
    - 需要自行維護來源清單與來源可用性
    en:
    - Cloudflare Pages and D1
    - The deployer maintains the source list and accepts source availability risk
  limitations:
    zh-tw:
    - 只保存來源快取，不擁有第三方新聞內容
    - 更新速度受來源 RSS 與排程影響
    en:
    - It caches source data but does not own third-party news content
    - Freshness depends on source feeds and schedules
categories:
- publishing
profile: small-app
repo:
  upstream: ourongxing/newsnow
  adapter: smallgreen-cloud/adapter-newsnow
  license: MIT
components:
  cloudflare:
  - pages
  - d1
login_method: none
data_flow:
  external_services:
  - 40+ 新聞來源站點（完整清單見上游 server/sources/，如 news.ycombinator.com、github.com、v2ex.com、zhihu.com
    等）
  - github.com
  disclosure: D1 僅存來源快取（可重建，非珍貴資料）與啟用登入時的使用者偏好同步。預設部署不啟用登入（上游 auth middleware 對缺 OAuth
    secrets 有防呆——登入功能自動停用，聚合 API 照常服務），啟用時 login_method 轉 github-oauth
verification:
  level: discovered
  spec_version: 0.2.1
  last_verified: '2026-08-03'
  evidence_packs:
