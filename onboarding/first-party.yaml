schema_version: "0.1.0"
title:
  zh-tw: 自有專案上架清單
  en: First-party projects entering the catalogue
projects:
  - id: homebox-edge
    name: HomeBox Edge
    state: evidence-needed
    state_label:
      zh-tw: 等待公開驗證
      en: Awaiting public verification
    product_summary:
      project_type:
        zh-tw: 自架的家庭與工作室資產管理小型專案
        en: A self-hosted asset inventory for homes and small studios
      problem:
        zh-tw: 解決設備、位置、保固與照片分散在試算表、訊息與雲端相簿，查找與交接都很困難的問題
        en: Solves the problem of household and studio asset data being scattered across spreadsheets, messages and photo albums
      audience:
        zh-tw: [家庭、工作室、需要管理設備的人]
        en: [Households, studios, people managing equipment]
      capabilities:
        zh-tw:
          - 資產新增、搜尋、編輯、封存與還原
          - HomeBox CSV／TSV 預覽、確認後匯入與匯出
          - 私有照片、縮圖與可撤銷的 AI 連線
        en:
          - Create, search, edit, archive and restore assets
          - Preview, confirm and exchange HomeBox CSV or TSV
          - Keep private photos and thumbnails with revocable AI connectors
      deployment_requirements:
        zh-tw: [Cloudflare Workers、D1、R2、KV 與 Images binding；需要自有 Cloudflare 帳號]
        en: [Cloudflare Workers, D1, R2, KV and Images binding; a Cloudflare account is required]
      limitations:
        zh-tw: [上架前仍需完成正式 release、部署驗收、teardown 與 Evidence Pack；AI 連線需自行管理供應商與費用]
        en: [A release, live acceptance, teardown and Evidence Pack are still required; AI connectors require your own provider and cost controls]
    architecture:
      cloudflare: [workers, d1, r2, kv, images]
      external_services: []
    current_stage:
      zh-tw: v0.2 功能與 SmallGreen 三份契約已完成，等待正確 Cloudflare 帳號下的真實部署與公開 Evidence Pack
      en: v0.2 features and the three SmallGreen contracts are complete; live deployment in the correct Cloudflare account and a public Evidence Pack remain
    next_steps:
      zh-tw:
        - 確認可存取既有 Worker 與 D1、KV、R2、Images 資源的 Cloudflare 帳號
        - 固定可上架的 main／release commit，並記錄部署前 migration 與資料備份狀態
        - 完成真實部署、照片與 CSV／MCP 驗收、teardown 與 Evidence Pack
      en:
        - Confirm the Cloudflare account that can access the existing Worker and D1, KV, R2 and Images resources
        - Freeze the publishable main or release commit and record pre-deploy migrations and backups
        - Complete live deployment, photo plus CSV/MCP acceptance, teardown and an Evidence Pack
    product_family: personal-vault

  - id: kb-vault
    name: Free Second Brain（kb-vault）
    state: canonical-repo-needed
    state_label:
      zh-tw: 整理後上架
      en: Canonicalisation before entry
    product_summary:
      project_type:
        zh-tw: 以 Markdown、D1 與 Remote MCP 組成的個人知識庫專案
        en: A personal knowledge base built from Markdown, D1 and Remote MCP
      problem:
        zh-tw: 解決研究、顧問與 AI 工作經驗散落在不同工具，日後無法搜尋、連結與重用的問題
        en: Solves the problem of research, consulting and AI work knowledge being fragmented across tools and difficult to search, connect and reuse
      audience:
        zh-tw: [研究者、顧問、創作者、需要累積 AI 工作記憶的人]
        en: [Researchers, consultants, creators, people building durable AI memory]
      capabilities:
        zh-tw:
          - Markdown 卡片、標籤、雙向連結與圖譜
          - D1 全文搜尋與 Remote MCP 讀寫
          - RSS 收集，以及選配的 Notion／GitHub 備份
        en:
          - Markdown cards, tags, bidirectional links and a graph view
          - D1 full-text search and Remote MCP read/write access
          - RSS collection plus optional Notion or GitHub backup
      deployment_requirements:
        zh-tw: [Cloudflare Workers、Pages、D1、KV、選配 R2 與 Cron；需要 OAuth、RSS 或備份服務的憑證時另行設定]
        en: [Cloudflare Workers, Pages, D1, KV, optional R2 and Cron; credentials are needed for OAuth, RSS or backup services]
      limitations:
        zh-tw: [目前有兩個 checkout，需先凍結 canonical repo；Notion、GitHub 與 RSS 是外部依賴，需各自驗證權限與資料邊界]
        en: [Two checkouts still need to be reconciled into one canonical repo; Notion, GitHub and RSS are external dependencies with separate permission and data-boundary checks]
    architecture:
      cloudflare: [workers, pages, d1, kv, r2, cron]
      external_services: [Google OAuth, RSS sources, Notion API (optional), GitHub API (optional)]
    current_stage:
      zh-tw: Worker、UI、MCP 與基本同步功能已存在，但目前有兩個 checkout，尚未凍結上架真相源
      en: Worker, UI, MCP and basic sync features exist, but two checkouts must be reconciled before publishing
    next_steps:
      zh-tw:
        - 決定 canonical repo 與 release commit
        - 補 SmallGreen 三檔契約、Agent 引導與外部服務揭露
        - 完成登入、MCP、RSS、同步與 teardown 的 Evidence Pack
      en:
        - Choose the canonical repository and release commit
        - Add the three SmallGreen contracts, Agent guidance and external-service disclosure
        - Produce an Evidence Pack covering login, MCP, RSS, sync and teardown
    product_family: personal-vault

  - id: meeting-capture-kit
    name: Meeting Capture Kit
    state: evidence-needed
    state_label:
      zh-tw: 等待公開驗證
      en: Awaiting public verification
    product_summary:
      project_type:
        zh-tw: 以 LINE、Cloudflare Worker 與 GitHub Actions 串成的會議紀錄處理流程
        en: A meeting-record pipeline connecting LINE, a Cloudflare Worker and GitHub Actions
      problem:
        zh-tw: 解決會議音訊留在聊天工具、難以轉錄整理，且敏感紀錄不希望集中在第三方 SaaS 的問題
        en: Solves the problem of meeting audio staying in chat tools, being hard to structure, and sensitive notes needing a private system of record
      audience:
        zh-tw: [需要掌握會議資料的顧問、團隊與個人工作者]
        en: [Consultants, teams and solo operators who need control of meeting records]
      capabilities:
        zh-tw:
          - LINE webhook 驗簽與使用者 allowlist
          - GitHub Actions 執行語音轉錄、術語校正與摘要
          - Private repo 留存會議 Markdown，並可回傳 LINE 通知
        en:
          - Signed LINE webhooks with an explicit user allowlist
          - GitHub Actions for transcription, terminology correction and summaries
          - Retain meeting Markdown in a private repo and send LINE notifications
      deployment_requirements:
        zh-tw: [Cloudflare Workers、KV、GitHub Actions 與 Private GitHub repository；需要 LINE、Groq 與 Gemini 憑證]
        en: [Cloudflare Workers, KV, GitHub Actions and a private GitHub repository; LINE, Groq and Gemini credentials are required]
      limitations:
        zh-tw: [仍需人工確認 provider 資料流、secret 與費用限制；目前以合成音訊驗收，尚未完成公開 Evidence Pack]
        en: [Provider data flows, secrets and cost limits still need human review; acceptance currently uses synthetic audio and the public Evidence Pack is not complete]
    architecture:
      cloudflare: [workers, kv]
      external_services: [LINE, GitHub Actions, Groq, Gemini]
    current_stage:
      zh-tw: 已有 Worker、pipeline、契約與合成驗收案例，但尚未建立 Registry 卡片與公開 Evidence Pack
      en: Worker, pipeline, contracts and synthetic acceptance cases exist, but no Registry card or public Evidence Pack exists yet
    next_steps:
      zh-tw:
        - 固定可上架的 template release commit 與公開資料邊界
        - 完成外部 provider 資料流、secret 與費用限制的人工 review
        - 用合成音訊完成真實部署、驗收、teardown 與 Evidence Pack
      en:
        - Freeze a publishable template release and its public data boundary
        - Human-review provider data flows, secrets and cost limits
        - Complete a live deployment, acceptance, teardown and Evidence Pack with synthetic audio
    product_family: pipeline

  - id: petmcp-sites
    name: PetMCP Sites
    state: evidence-needed
    state_label:
      zh-tw: 候選專案｜等待實機驗收
      en: Candidate | live acceptance pending
    product_summary:
      project_type:
        zh-tw: 在自己的 ChatGPT Site 使用的毛孩健康手帳
        en: A personal pet health journal in your own ChatGPT Site
      problem:
        zh-tw: 把血檢報告、日常照護與食品營養標籤收在一起，回診前能查到原始值與修正歷程
        en: Keep lab reports, daily care and food labels together, with original values and correction history for
          later review
      audience:
        zh-tw:
        - 希望整理毛孩健康紀錄的一般飼主
        - 具有 ChatGPT Sites 建立權限的個人使用者
        en:
        - Pet owners organising health records
        - Individuals with permission to create ChatGPT Sites
      capabilities:
        zh-tw:
        - 寵物檔案與私人頭像
        - 血檢保留原始值、單位、日期與來源；同項同單位趨勢
        - 日常照護與食品營養標籤，標籤不推定已食用
        - 由 ChatGPT 原生影像／語音／推理配合個人 MCP；寫入前人工核對
        - 可修正、稽核、匯出、空白帳號還原與刪除
        en:
        - Pet profiles and private avatars
        - Original lab values, units, dates and sources, with trends separated by exact unit
        - Daily care and food labels; a label does not imply consumption
        - Native ChatGPT vision, voice and reasoning with a personal MCP; review before saving
        - Corrections, audit history, export, empty-account restore and deletion
      deployment_requirements:
        zh-tw:
        - 需要有 Sites 建立權限的 ChatGPT 方案；資格及建置／AI 額度依帳號當下官方顯示
        - 在 ChatGPT 內以公開鎖定版本建立自己的私人 Site，再安裝自己的 Site PWA
        - 不另申請 Cloudflare，不使用 BYOC、外部 AI API Key 或 SmallGreen 共用寵物後端
        en:
        - A ChatGPT plan with Sites creation access; eligibility, build and AI quotas follow current account policy
        - Create your own private Site from a pinned public source inside ChatGPT, then install that Site as a PWA
        - No separate Cloudflare account, BYOC, external AI API key or shared SmallGreen pet backend
      limitations:
        zh-tw:
        - Candidate：Sites、MCP、照片、Voice、Android 及 teardown 必須各自有實測證據，不能互相替代
        - 照片先存自己的 Site；不承諾 PWA 麥克風或照片無縫送進 ChatGPT Live
        - 完整備份上限 20 MB、原圖總量 10 MB；1000 筆紀錄、100 照片、5000 筆稽核，超限會拒絕
        - 只整理紀錄，不取代獸醫診斷；公開 Site 可讀不代表免費帳號可建立私人 Site
        en:
        - 'Candidate: Sites, MCP, photos, Voice, Android and teardown each need their own live evidence'
        - Photos stay in your Site; no claim of seamless microphone or photo forwarding into ChatGPT Live
        - 'Backup limit: 20 MB total, 10 MB raw photos; 1000 records, 100 photos, 5000 audit events; oversize requests
          fail explicitly'
        - Record organisation is not a veterinary diagnosis; public viewing does not imply free-account private-Site
          creation
    architecture:
      sites:
      - site
      - d1
      - r2
      - mcp
      external_services: []
    current_stage:
      zh-tw: 已驗證原生私人 Sites 部署、個人 MCP 寫讀修正、PWA 顯示、合成照片辨識與人工確認後寫入，以及含原圖備份的清除還原；6 筆合成紀錄、1 張照片、7 筆稽核比對一致。本次插件在 Codex 操作，不能代替手機 ChatGPT 驗收。最新證據為開源 Repo 的 evidence/2026-11-22-final-acceptance-v2.json，維持 Candidate
      en: Native private Sites deployment, personal MCP read/write/correction, PWA display, and synthetic photo upload,
        retrieval, AI transcription and human-confirmed saving are verified. The plugin was exercised in Codex, not
        the mobile ChatGPT client. After authorized purge and restore, all 6 synthetic records, 1 original photo and
        7 audit events matched exactly. See evidence/2026-11-22-final-acceptance-v2.json in the source repository; status remains Candidate
    next_steps:
      zh-tw:
      - 用第二個真實帳號驗證紀錄與照片隔離
      - 完成手機 ChatGPT 圖片工具交接、原生 Voice 及 Android PWA 實機驗收
      - 補齊 SmallGreen legacy conformance 對 Sites manifest 的支援與外部驗收
      - 取得 teardown 與受管資源 zero-diff 證據後再評估 Ready
      en:
      - Verify record and photo isolation using a second real account
      - Verify photo-tool handoff in mobile ChatGPT, native Voice and Android PWA on a real device
      - Complete Sites-manifest support in legacy SmallGreen conformance and external acceptance
      - Collect teardown and managed-resource zero-diff evidence before assessing Ready
    source:
      repository: smallgreen-cloud/petmcp-sites
      locked_commit: ed20ee8fbda440a7f1b44007528394b726ae4f62
      license: MIT
    agent_install:
      protocol: smallgreen-install/v1
      status: candidate
      deployment_ready: false
      contract_url: https://raw.githubusercontent.com/smallgreen-cloud/petmcp-sites/4d973a7f9becc006d94c5f14788b0ecfe2c10311/.smallgreen/install.yaml
      target:
        client: chatgpt-work
        hosting: sites
        execution_mode: native-sites
      hosting:
        managed_resources:
        - site
        - d1
        - r2
        external_infrastructure: []
      cta:
        zh-tw: 建立我的 PetMCP
        en: Create my PetMCP
      trigger:
        zh-tw: 請先讀取 https://raw.githubusercontent.com/smallgreen-cloud/petmcp-sites/4d973a7f9becc006d94c5f14788b0ecfe2c10311/.smallgreen/install.yaml，核對
          MIT 與公開 source commit ed20ee8fbda440a7f1b44007528394b726ae4f62，只用 ChatGPT Work / Sites 原生工具為我建立私人 PetMCP。無
          Sites 權限就停止，不可改用獨立 Cloudflare、BYOC、外部 AI API key 或共享後端。部署後以合成資料驗收 MCP 寫讀、PWA、修正稽核、照片與備份還原；Voice、Android、第二帳號隔離與
          teardown 分別列 pass/fail/blocked/not tested，不可宣稱 SmallGreen Ready。
        en: Read https://raw.githubusercontent.com/smallgreen-cloud/petmcp-sites/4d973a7f9becc006d94c5f14788b0ecfe2c10311/.smallgreen/install.yaml,
          verify MIT and public source commit ed20ee8fbda440a7f1b44007528394b726ae4f62, and create my private PetMCP
          using native ChatGPT Work / Sites only. Stop without Sites access; do not substitute Cloudflare, BYOC, external
          AI API keys or a shared backend. Test synthetic MCP write/read, PWA, corrections, photos and backup/restore.
          Report Voice, Android, second-account isolation and teardown separately as pass/fail/blocked/not tested;
          do not claim SmallGreen Ready.
      steps:
        zh-tw:
        - 複製部署提示，在具有 Sites 權限的 ChatGPT 對話中貼上，依帳號顯示核對方案與額度
        - 等待原生 Sites terminal 成功，保存自己的 Site URL；expected URL 不是發布證明
        - 安裝／連線 Sites 為你建立的個人 MCP，先讀取，再用合成資料寫入與修正
        - 開啟自己的 Site，上傳照片；回 ChatGPT 用個人 MCP 取得影像，人工確認辨識草稿後再存檔
        - Android Chrome 開啟自己的 Site，選「安裝應用程式／新增至主畫面」；逐項測試返回、更新、照片權限與登入保持
        - 用完整備份驗證空白帳號還原；未實測項目維持未通過
        en:
        - Copy the prompt into ChatGPT with Sites access; check the plan and allowance shown by your account
        - Wait for native Sites terminal success and keep your own Site URL; an expected URL is not proof of publication
        - Install/connect the personal MCP created by Sites; read first, then test synthetic writes and corrections
        - Upload a photo in your own Site; ask ChatGPT to retrieve it through your personal MCP, review the draft,
          then save
        - Open your own Site in Android Chrome, install/add to home screen, and test return, updates, photo permission
          and retained sign-in
        - Verify a full backup by restoring to an empty account; untested items remain unverified
      privacy:
        zh-tw: SmallGreen 只提供開源介紹與部署引導，不保存你的個人 Site URL、帳號、寵物紀錄或照片。資料保存在你自己的 Sites 受管資料庫與附件中；PWA 不內嵌 ChatGPT，也不把健康資料放進網址。
        en: SmallGreen provides source and deployment guidance only; it does not store your Site URL, account, pet
          records or photos. Data stays in your own Sites-managed database and storage. The PWA does not embed ChatGPT
          or put health data into URLs.
      blockers:
      - Second-real-account isolation evidence pending
      - Mobile ChatGPT photo-tool handoff, native Voice and Android PWA acceptance pending
      - Sites teardown / managed-resource zero-diff evidence pending
      - Legacy Wrangler conformance does not yet recognise Sites manifests
    product_family: personal-vault
